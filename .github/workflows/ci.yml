# 唯一的必需检查：GitHub 用 job id 作检查名，固定为「gate」。
# 硬规则：job id 就叫 gate 且不写 name；不写 paths 过滤；gate 不写 job 级 if；
# 每个 job 写 runs-on 与 timeout-minutes；判断和命令全部放在 scripts/，这里只做薄壳。
# 失败通知用 GitHub 自带的邮件与网页通知，这里不另发。
name: CI
on:
  pull_request:
  push:
    branches: [main]
# PR 按 ref 分组，新推送取消同一 PR 的旧 run；push 按 SHA 分组，每条提交都完整复核
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# run 一律用 bash（-eo pipefail），不依赖 runner 镜像的默认 shell
defaults:
  run:
    shell: bash
jobs:
  gate:
    runs-on: ubuntu-24.04 # bootstrap --stack 按栈替换为 GitHub 托管 runner 的 label
    timeout-minutes: 30 # bootstrap --stack 按栈调整（iOS 为 45）
    env:
      # 不可信字段只经 env 传入，不直接拼进 run
      PR_TITLE: ${{ github.event.pull_request.title }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pnpm 版本取自 package.json 的 packageManager，Node 版本取自 .node-version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # uv 给 AstrBot 插件用；setup-uv 没有浮动的大版本标签，按提交钉住（v10.3.2）
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: 0.13.5
      # 补齐 runner 环境里缺的门禁工具（托管镜像没有 actionlint；Go 版本按 go.mod）
      - name: 准备工具
        run: scripts/ci/setup-tools.sh >> "$GITHUB_PATH"
      - name: 提交信息
        run: scripts/ci/check-msg.sh
      - name: 改动类型
        id: kind
        run: scripts/ci/changed-kind.sh >> "$GITHUB_OUTPUT"
      - name: 快速检查
        if: steps.kind.outputs.code != 'true'
        run: scripts/check.sh --quick
      - name: 完整检查
        if: steps.kind.outputs.code == 'true'
        run: scripts/check.sh --full

  # Windows 上只跑 JS 的用例：平台有关的行为（起 .cmd 命令、路径、权限）要在真的 Windows 上核对；
  # 门禁的其余部分和系统无关，在上面那个 job 里跑过了
  test-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # 一个包挂了也把别的包跑完：一次看全在 Windows 上不对的地方
      - name: 测试
        run: pnpm -r --no-bail test
